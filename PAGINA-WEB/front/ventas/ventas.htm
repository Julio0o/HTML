<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KUBO - Gestión de Inventario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="ventas.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <nav class="side-nav">
        <h1 class="logo">KUBO<span>.</span></h1>
        <a href="../index.html" class="back-link">← Volver a la tienda</a>
        <button class="cart-toggle" data-bs-toggle="offcanvas" data-bs-target="#carritoLateral">
            <i class="fas fa-shopping-cart"></i>
        </button>
    </nav>

    <main class="container">
        <header>
            <h2>Gestión de Biblioteca</h2>
            <p>Panel para dar de alta, modificar o eliminar productos.</p>
        </header>

        <div class="dashboard-grid">
            <section class="card form-section">
                <h3>Registrar Nuevo Libro</h3>
                <form id="productForm">
                    <div class="form-field">
                        <label>Título del Libro</label>
                        <input type="text" id="prodNombre" placeholder="Ej. El Principito" required>
                    </div>
                    <div class="form-field">
                        <label>Autor</label>
                        <input type="text" id="prodAutor" placeholder="Nombre del autor" required>
                    </div>
                    <div class="input-row">
                        <div class="form-field">
                            <label>Precio ($)</label>
                            <input type="number" id="prodPrecio" step="0.01" placeholder="0.00" required>
                        </div>
                        <div class="form-field">
                            <label>Stock</label>
                            <input type="number" id="prodStock" placeholder="0" required>
                        </div>
                    </div>
                    <button type="submit" class="btn-primary">Dar de Alta</button>
                </form>
            </section>

            <section class="card table-section">
                <h3>Inventario Actual</h3>
                <table id="productTable">
                    <thead>
                        <tr>
                            <th>Libro</th>
                            <th>Precio</th>
                            <th>Stock</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td>
                                <button class="btn-edit" title="Editar"><i class="fas fa-edit"></i></button>
                                <button class="btn-delete" title="Eliminar"><i class="fas fa-trash"></i></button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </section>
        </div>
    </main>
    <script src="ventas.js"></script>
    <!-- Carrito lateral con Bootstrap Offcanvas -->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="carritoLateral" aria-labelledby="carritoLabel">
        <div class="offcanvas-header border-bottom">
            <h5 class="offcanvas-title fw-bold" id="carritoLabel">
                <i class="fas fa-shopping-cart me-2"></i>Tu Carrito
            </h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
        </div>
        <div class="offcanvas-body d-flex flex-column p-0">
            <div class="flex-grow-1 p-3 overflow-auto" id="carritoItems">
                <!-- Los items del carrito aparecerán aquí -->
                <p class="text-center text-muted mt-4">El carrito está vacío</p>
            </div>
            <div class="p-3 border-top bg-light">
                <div class="d-flex justify-content-between align-items-center fw-bold mb-3 fs-5">
                    <span>Total:</span>
                    <span id="carritoPrecioTotal" class="text-primary">$0.00</span>
                </div>
                <button class="btn btn-primary w-100 py-2 fw-semibold">Finalizar Compra</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
