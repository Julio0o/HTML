<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KUBO - Iniciar Sesión</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <div class="login-wrapper">
        <a href="../index.html" class="back-link">← Volver a la tienda</a>

        <div class="login-box">
            <h1 class="logo">KUBO<span>.</span></h1>
            <h2>Bienvenido</h2>
            <p>Ingresa tus datos para continuar</p>

            <form id="loginForm">
                <div class="input-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" placeholder="ejemplo@correo.com" required>
                </div>
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-login">Inicia Sesión</button>
            </form>

            <div class="footer-links">
                <a href="#">¿Olvidaste tu contraseña?</a>
                <a href="#">Crear cuenta</a>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="login.js"></script>
    <div class="carrito-overlay" id="carritoOverlay"></div>
    <div class="carrito-lateral" id="carritoLateral">
        <div class="carrito-header">
            <h3>Tu Carrito</h3>
            <button class="cerrar-carrito" id="cerrarCarrito"><i class="fas fa-times"></i></button>
        </div>
        <div class="carrito-items" id="carritoItems">
            <!-- Los items del carrito aparecerán aquí -->
            <p class="carrito-vacio">El carrito está vacío</p>
        </div>
        <div class="carrito-footer">
            <div class="carrito-total">
                <span>Total:</span>
                <span id="carritoPrecioTotal">$0.00</span>
            </div>
            <button class="btn btn-primary" style="width: 100%; text-align: center;">Finalizar Compra</button>
        </div>
    </div>
    <script src="../carrito.js"></script>
</body>

</html>
