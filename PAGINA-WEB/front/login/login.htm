<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KUBO - Iniciar Sesión</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <div class="login-wrapper">
        <a href="../index.html" class="back-link">← Volver a la tienda</a>

        <div class="login-box">
            <h1 class="logo">KUBO<span>.</span></h1>
            
            <div id="form-container">
                <h2 id="form-title">Bienvenido</h2>
                <p id="form-subtitle">Ingresa tus datos para continuar</p>

                <form id="auth-form">
                    <div id="register-fields" style="display: none;">
                        <div class="input-group">
                            <label for="nombre">Nombre</label>
                            <input type="text" id="nombre" placeholder="Tu nombre">
                        </div>
                        <div class="input-group">
                            <label for="apellidos">Apellidos</label>
                            <input type="text" id="apellidos" placeholder="Tus apellidos">
                        </div>
                        <div class="input-group">
                            <label for="edad">Edad</label>
                            <input type="number" id="edad" placeholder="Tu edad" min="1">
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="email">Correo electrónico</label>
                        <input type="email" id="email" placeholder="ejemplo@correo.com" required>
                    </div>
                    <div class="input-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn-login" id="submit-btn">Inicia Sesión</button>
                </form>
            </div>

            <div class="footer-links">
                <a href="#" id="forgot-password">¿Olvidaste tu contraseña?</a>
                <span id="spacer" style="display: none;"></span>
                <a href="#" id="toggle-link">Crear cuenta</a>
            </div>

            <div class="social-login">
                <p>O <span id="social-action">inicia sesión</span> con</p>
                <div class="social-icons">
                    <a href="#" class="social-icon"><i class="fab fa-facebook-f"></i></a>
                    <a href="#" class="social-icon"><i class="fab fa-twitter"></i></a>
                    <a href="#" class="social-icon"><i class="fab fa-instagram"></i></a>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="login.js"></script>
</body>

</html>
