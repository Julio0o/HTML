<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KUBO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <header>
        <input type="checkbox" id="toggler">
        <label for="toggler" class="fas fa-bars"></label>
        <div class="logo-container">
            <div class="loader"></div>
            <a href="javascript:void(0)" class="logo">KUBO<span>.</span></a>
        </div>
        <nav class="barranav">
            <a href="#principal">Inicio</a>
            <a href="productos/productos.html">Productos</a>
            <a href="mision/mision.htm">Misión</a>
            <a href="vision/vision.htm">Visión</a>
            <a href="contacto/contacto.htm">Contacto</a>
        </nav>

        <!-- Iconos de usuario, carrito y favoritos -->
        <div class="iconos">
            <a href="#" class="fas fa-heart"></a>
            <a href="#" class="fas fa-shopping-cart"></a>
            <a href="#" class="fas fa-user"></a>
        </div>
    </header>

    <section class="principal" id="principal">
        <div class="contenido">
            <h1 class="main-header">Bienvenido a KUBO</h1>
            <p class="subheader">Descubre productos únicos con la mejor calidad</p>
            <p class="subheader">hoal</p>
            <div class="lineas-texto">
                <div class="linea"></div>
                <div class="linea"></div>
            </div>
            <div class="botones-hero">
                <button class="btn btn-primary">Explorar Ahora</button>
                <button class="btn btn-secondary">ay no se</button>
            </div>
        </div>
        <div class="imagen-hero">
            <div class="placeholder-imagen">
                <i class="fas fa-image"></i>
            </div>
        </div>
    </section>
    <section class="caracteristicas">
        <h2 class="titulo-seccion">Nuestras Características</h2>
        <div class="subtitulo-lineas">
            <div class="linea-sub"></div>
            <div class="linea-sub"></div>
        </div>
        
        <div class="contenedor-caracteristicas">
            <div class="caracteristica-item">
                <div class="icono-circular">
                    <i class="fas fa-shipping-fast"></i>
                </div>
                <h3 class="subheader-item">Envío Rápido</h3>
                <div class="lineas-descripcion">
                    <div class="linea-desc">bk</div>
                    <div class="linea-desc"></div>
                </div>
            </div>

            <div class="caracteristica-item">
                <div class="icono-circular">
                    <i class="fas fa-shield-alt"></i>
                </div>
                <h3 class="subheader-item">Compra Segura</h3>
                <div class="lineas-descripcion">
                    <div class="linea-desc"></div>
                    <div class="linea-desc"></div>
                </div>
            </div>

            <div class="caracteristica-item">
                <div class="icono-circular">
                    <i class="fas fa-medal"></i>
                </div>
                <h3 class="subheader-item">Calidad Premium</h3>
                <div class="lineas-descripcion">
                    <div class="linea-desc"></div>
                    <div class="linea-desc"></div>
                </div>
            </div>
        </div>
    </section>

    <section class="productos">
        <h2 class="titulo-seccion">Productos Destacados</h2>
        <div class="subtitulo-lineas">
            <div class="linea-sub"></div>
            <div class="linea-sub"></div>
        </div>

        <div class="carrusel-contenedor">
            <button class="carrusel-btn btn-izquierda">
                <i class="fas fa-chevron-left"></i>
            </button>

            <div class="carrusel-track-contenedor">
                <div class="carrusel-track" id="carruselTrack">
                </div>
            </div>
            <button class="carrusel-btn btn-derecha">
                <i class="fas fa-chevron-right"></i>
            </button>
        </div>

        <div class="carrusel-indicadores">
            <span class="indicador active" data-index="0"></span>
            <span class="indicador" data-index="1"></span>
            <span class="indicador" data-index="2"></span>
            <span class="indicador" data-index="3"></span>
            <span class="indicador" data-index="4"></span>
        </div>
    </section>

    <section class="cta-section">
        <h2 class="titulo-seccion">¿Listo para Comenzar?</h2>
        <div class="subtitulo-lineas cta-lineas">
            <div class="linea-sub"></div>
            <div class="linea-sub"></div>
        </div>
        <button class="btn btn-cta">Inicia Sesión</button>
    </section>

    <footer class="footer">
        <div class="footer-contenido">
            <div class="footer-columna">
                <div class="footer-logo">
                    <div class="loader-footer"></div>
                    <h3>KUBO<span>.</span></h3>
                </div>
                <div class="footer-lineas">
                    <div class="linea-footer"></div>
                    <div class="linea-footer"></div>
                    <div class="linea-footer"></div>
                </div>
            </div>

            <div class="footer-columna">
                <h4 class="footer-titulo">Menú</h4>
                <div class="footer-links">
                    <div class="link-linea"></div>
                    <div class="link-linea"></div>
                    <div class="link-linea"></div>
                    <div class="link-linea"></div>
                </div>
            </div>

            <div class="footer-columna">
                <h4 class="footer-titulo">Menú</h4>
                <div class="footer-links">
                    <div class="link-linea"></div>
                    <div class="link-linea"></div>
                    <div class="link-linea"></div>
                    <div class="link-linea"></div>
                </div>
            </div>

            <div class="footer-columna">
                <h4 class="footer-titulo">Menú</h4>
                <div class="footer-links">
                    <div class="link-linea"></div>
                    <div class="link-linea"></div>
                    <div class="link-linea"></div>
                    <div class="link-linea"></div>
                </div>

                <div class="redes-sociales">
                    <a href="#"><i class="fab fa-facebook-f"></i></a>
                    <a href="#"><i class="fab fa-twitter"></i></a>
                    <a href="#"><i class="fab fa-instagram"></i></a>
                </div>
            </div>
        </div>

        <div class="footer-bottom">
            <div class="copyright-lineas">
                <div class="linea-copy"></div>
                <div class="linea-copy"></div>
            </div>
        </div>
    </footer>

    <script src="index.js"></script>
</body>
</html>
